name: Procurement ingest digest

on:
  # PRIMARY trigger: chain off the RSS ingest so the digest posts minutes after
  # the Mon/Thu ingests actually ran. Rationale (60-day audit, 2026-08-31):
  # GitHub's cron scheduler fired 0 of 18 digest slots within 30 min - median
  # +97 min, worst +9.4 h (08-27), one slot cancelled by runner starvation
  # (08-06), one never fired at all (08-31). Chaining costs one scheduler hit
  # instead of four and can never post before the data lands.
  workflow_run:
    workflows: ["Twice-weekly RSS/feed ingest"]
    types: [completed]
  schedule:
    # FALLBACK crons, deliberately off the :00/:30/:45 congestion minutes
    # (GitHub documents top-of-hour scheduled jobs as delayable/droppable).
    # Fallback 1 - Mon + Thu 14:38 UTC = 09:38 Houston CDT.
    - cron: '38 14 * * 1,4'
    # Fallback 2 - Mon + Thu 18:40 UTC = 13:40 Houston CDT, so a dropped
    # morning slot still delivers by lunch. The idempotency guard below keeps
    # multiple triggers from double-posting.
    - cron: '40 18 * * 1,4'
  workflow_dispatch:

env:
  # The tracking issue the digest posts to. Pinned by number: the old
  # title-search lookup could silently create a NEW bot-authored issue (which
  # the operator is not subscribed to) on a search hiccup or a closed #43.
  DIGEST_ISSUE: "43"

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read

jobs:
  digest:
    name: Post procurement ingest digest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # With three triggers, first-to-post wins and the rest no-op: a cron
      # firing hours late from GitHub's backlog must not double-post after the
      # workflow_run trigger already delivered today's digest. Manual
      # dispatches always post a fresh digest.
      - name: Idempotency guard - has today's digest already posted?
        id: guard
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(date -u +%F)
          COUNT=$(gh api "repos/${{ github.repository }}/issues/${DIGEST_ISSUE}/comments?since=${TODAY}T00:00:00Z&per_page=100" \
            --jq "[.[] | select(.body | startswith(\"# Procurement ingest digest - ${TODAY}\"))] | length" || echo 0)
          if [ "${COUNT:-0}" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Digest for ${TODAY} already posted (${COUNT} comment(s)) - skipping this trigger."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python 3.11
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build digest
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TODAY=$(date -u +%F)

          {
            echo "# Procurement ingest digest - ${TODAY}"
            echo
            echo "Triggered by: \`${EVENT_NAME}\` ([run #${RUN_NUMBER}](${RUN_URL}))"
            echo
            echo "## Current active pipeline"
            echo
            echo '```text'
            python tools/pipeline.py summary
            echo '```'
            echo
            echo "## Top opportunities by win_score (composite rank)"
            echo
            echo '```text'
            python tools/win_score.py rank --source pipeline --top 10
            echo '```'
            echo
            echo "## Fix this to unlock the most win-weighted pipeline (readiness backlog)"
            echo
            echo '```text'
            python tools/readiness.py backlog
            echo '```'
            echo
            echo "## ⏰ Response deadlines — act or close"
            echo
            echo '```text'
            python tools/lead_radar.py deadlines
            echo '```'
            echo
            echo "## Current Lead Radar"
            echo
            echo '```text'
            python tools/lead_radar.py summary
            echo '```'
            echo
            echo "## Upcoming re-bid prep windows"
            echo
            echo '```text'
            python tools/lead_radar.py calendar --emit --stdout
            echo '```'
            echo
            echo "## Demand Radar — upcoming buy-windows (pre-RFP construction signals; sales outreach, not bids)"
            echo
            echo '```text'
            python tools/demand_radar.py summary
            echo '```'
            echo
            echo "## Open automation PRs"
            echo
          } > /tmp/digest.md

          gh pr list --state open --json number,title,url,headRefName,updatedAt \
            --jq '.[] | select(.headRefName | startswith("auto/")) | "- #\(.number) [\(.title)](\(.url)) (`\(.headRefName)`, updated \(.updatedAt))"' \
            > /tmp/open_auto_prs.md

          if [ -s /tmp/open_auto_prs.md ]; then
            cat /tmp/open_auto_prs.md >> /tmp/digest.md
          else
            echo "No open automation PRs." >> /tmp/digest.md
          fi

          {
            echo
            echo "## Recent ingest runs"
            echo
          } >> /tmp/digest.md

          gh run list --limit 30 \
            --json workflowName,conclusion,status,createdAt,url,event \
            --jq '.[] | select(.workflowName == "Twice-weekly SAM.gov mattress ingest" or .workflowName == "Daily email-alert ingest (IMAP)" or .workflowName == "Twice-weekly RSS/feed ingest") | "- \(.workflowName): \(.conclusion // .status) on \(.createdAt) ([run](\(.url)))"' \
            > /tmp/recent_runs.md

          if [ -s /tmp/recent_runs.md ]; then
            cat /tmp/recent_runs.md >> /tmp/digest.md
          else
            echo "No recent ingest runs found." >> /tmp/digest.md
          fi

          {
            echo
            echo "## What to do"
            echo
            echo "- **Response deadlines first.** Anything under \`DUE WITHIN\` needs a bid/no-bid call now; anything under \`OVERDUE\` is a missed window that should be closed to a terminal status (\`no-fit\`/\`stale\`/\`archived\`) so the list stays honest."
            echo "- If there are open automation PRs, review those next — merge them the day they land, since two open ingest runs will collide on overlapping windows."
            echo "- Active pipeline rows are confirmed bid candidates; Lead Radar rows are watch/research signals."
            echo "- Demand Radar rows are pre-RFP private-sector construction signals for human outreach (sales), NOT biddable solicitations."
            echo "- Re-bid prep windows are dated prep-start reminders for expiring awarded contracts. Pushing them to Google Calendar is an operator/assistant step: read \`leads/review/_calendar_events.json\` and create each \`already_scheduled: false\` event via the Google Calendar MCP tool, then record its id in \`leads/review/_calendar_state.json\`."
            echo "- If both counts look unchanged and there are no automation PRs, no action is needed."
          } >> /tmp/digest.md

          cat /tmp/digest.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post digest to the tracking issue
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATE=$(gh issue view "$DIGEST_ISSUE" --json state --jq .state || echo "MISSING")
          if [ "$STATE" != "OPEN" ]; then
            echo "::warning::Digest issue #${DIGEST_ISSUE} is ${STATE}; creating a replacement - update DIGEST_ISSUE in this workflow"
            ISSUE_URL=$(gh issue create --title "Procurement ingest digest" \
              --assignee beford782 \
              --body "Replacement digest tracking issue: #${DIGEST_ISSUE} was ${STATE}. Update DIGEST_ISSUE in .github/workflows/procurement_digest.yml to this issue's number so future digests (and their notification emails) land here. cc @beford782")
            DIGEST_ISSUE="${ISSUE_URL##*/}"
          fi
          gh issue comment "$DIGEST_ISSUE" --body-file /tmp/digest.md
          echo "Posted digest comment to issue #${DIGEST_ISSUE}"

      # Direct email copy to the operator's working mailbox (DIGEST_EMAIL_TO
      # secret), independent of GitHub notification routing - the operator had
      # been hand-forwarding digests there. Self-notification over the
      # established Gmail app-password channel; non-fatal like every notify
      # send (the #43 GitHub notification email remains the backstop).
      - name: Email digest copy to the operator
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_EMAIL_TO: ${{ secrets.DIGEST_EMAIL_TO }}
        run: |
          python tools/notify_push.py \
            --subject "[Silverline] Procurement digest $(date -u +%F)" \
            --body-file /tmp/digest.md \
            --to "$DIGEST_EMAIL_TO" \
            || echo "::warning::digest email copy failed (see log); the #43 notification email is unaffected"

      # Dead-man's-switch: ping healthchecks.io ONLY on success, so a missed
      # or failed Mon/Thu digest raises an alert that does not depend on
      # GitHub's scheduler or notification email. No-op until the operator
      # creates the check (Mon/Thu schedule, ~2 h grace) and sets the
      # HEALTHCHECK_URL repo secret.
      - name: Healthcheck ping (success only)
        if: success()
        shell: bash
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -n "$HEALTHCHECK_URL" ]; then
            curl -fsS -m 10 --retry 3 "$HEALTHCHECK_URL" >/dev/null || true
            echo "Pinged healthcheck."
          else
            echo "HEALTHCHECK_URL not set - skipping ping."
          fi

      # A failed digest was previously only a generic Actions email. Match the
      # ingest workflows: email Blake directly AND open/comment a GitHub issue.
      - name: Alert on failure (email + issue)
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
        run: |
          # Email (non-fatal; no-op if creds are the thing that's missing).
          python tools/notify_push.py --failure --run-url "$RUN_URL" || true
          # GitHub issue (create-or-comment de-dupes).
          TITLE="Ingest failure: ${WORKFLOW}"
          TODAY=$(date -u +%F)
          BODY=$(printf '%s\n' \
            "The **${WORKFLOW}** workflow FAILED on ${TODAY}." \
            "" \
            "- Failed run: ${RUN_URL}" \
            "- Impact: the Mon/Thu digest did not post, so the operator gets no report for this slot." \
            "- Check the run log, fix, then re-run with \`gh workflow run procurement_digest.yml\`.")
          EXISTING=$(gh issue list --state open --search "\"${TITLE}\" in:title" --json number,title \
            --jq ".[] | select(.title == \"${TITLE}\") | .number" | head -n 1 || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
