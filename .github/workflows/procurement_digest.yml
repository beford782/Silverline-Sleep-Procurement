name: Procurement ingest digest

# THE one report. Notification policy (2026-09-08 redesign):
#   - exactly one digest email per Mon/Thu slot, sent over SMTP to the single
#     business mailbox in the DIGEST_EMAIL_TO secret (beford@silverlinesleep.com)
#   - nothing else in this repo emails the operator: ingest runs open PRs and
#     their new rows are folded into this digest ("New since last digest"),
#     the old standalone email-pipe watchdog is now a section here, and
#     failed runs are listed at the top instead of alerting individually
#   - no GitHub issue is used as a mail channel. The previous design posted
#     each digest as a comment on a tracking issue; once that issue was closed
#     (2026-08-31) every run created a NEW issue, assigned it, and @mentioned
#     the operator - three GitHub notification emails per run to the wrong
#     mailbox, four runs a day. That path is gone, not patched.
#   - the only other email this workflow can send is a short "digest FAILED"
#     note to the same mailbox (if: failure()).

on:
  # PRIMARY trigger: chain off the RSS ingest, which is the last of the Mon/Thu
  # ingests, so the digest posts minutes after the data lands. (60-day audit
  # 2026-08-31: GitHub's cron fired 0 of 18 digest slots within 30 min.)
  workflow_run:
    workflows: ["Twice-weekly RSS/feed ingest"]
    types: [completed]
  schedule:
    # ONE fallback cron - Mon + Thu 20:40 UTC = 15:40 Houston CDT - for the day
    # the chain never fires. The guard job below makes any second trigger a
    # no-op, so this cannot double-send.
    - cron: '40 20 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

env:
  DIGEST_WINDOW_DAYS: "4"

jobs:
  # Send-once guard. A trigger is skipped when a run of this workflow already
  # SENT today's digest: we look for a completed run created today whose
  # "Send digest email" step concluded success (a skipped run also concludes
  # "success", so run conclusion alone is not enough). Manual dispatches always
  # send a fresh digest.
  guard:
    name: Skip if today's digest was already sent
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Look for a run that already sent today's digest
        id: check
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW_FILE: procurement_digest.yml
          SEND_STEP: Send digest email
        run: |
          TODAY=$(date -u +%F)
          # The in-flight run is not "completed", so it cannot match itself.
          IDS=$(gh api "repos/${GH_REPO}/actions/workflows/${WORKFLOW_FILE}/runs?per_page=50&status=completed" \
            --jq ".workflow_runs[] | select(.conclusion == \"success\") | select(.created_at | startswith(\"${TODAY}\")) | .id" 2>/dev/null || true)
          SENT=0
          for id in $IDS; do
            n=$(gh api "repos/${GH_REPO}/actions/runs/${id}/jobs" \
              --jq "[.jobs[].steps[]? | select(.name == \"${SEND_STEP}\" and .conclusion == \"success\")] | length" 2>/dev/null || echo 0)
            SENT=$((SENT + ${n:-0}))
          done
          if [ "$SENT" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Today's digest was already sent (${SENT} send step(s) succeeded) - skipping this trigger."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  digest:
    name: Build and email the procurement digest
    runs-on: ubuntu-latest
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Refuse to build if the recipient is unset: notify_push would otherwise
      # fall back to NOTIFY_EMAIL_TO / the sender mailbox, and the whole point
      # of this workflow is that the report goes to exactly one address.
      - name: Verify the digest recipient is configured
        shell: bash
        env:
          DIGEST_EMAIL_TO: ${{ secrets.DIGEST_EMAIL_TO }}
        run: |
          if [ -z "$DIGEST_EMAIL_TO" ]; then
            echo "::error::DIGEST_EMAIL_TO repo secret is not set - refusing to send the digest anywhere else. Set it to the business mailbox at Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "Digest recipient configured."

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Folded-in watchdog: the daily IMAP ingest can run green while fetching
      # NOTHING (Power Automate flow off, Gmail label renamed, portal dropped
      # the contact). Read the fetched count from the last 7 successful daily
      # runs and let tools/email_watchdog.py decide. Non-fatal: a hiccup here
      # must never block the report.
      - name: Email-alert pipe health (folded-in watchdog)
        id: pipe
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          THRESHOLD=7
          ids=$(gh run list --workflow daily_email_ingest.yml --status success \
                  --limit "$THRESHOLD" --json databaseId --jq '.[].databaseId' 2>/dev/null || true)
          counts=""
          for id in $ids; do
            n=$(gh run view "$id" --log 2>/dev/null \
                 | grep -oE 'email alerts fetched: [0-9]+' | grep -oE '[0-9]+' | head -n 1)
            if [ -n "$n" ]; then counts="$counts $n"; fi
          done
          python tools/email_watchdog.py --counts "$counts" --threshold "$THRESHOLD" > /tmp/wd.out 2>/dev/null || echo "alert=unknown" > /tmp/wd.out
          ALERT=$(grep -oE '^alert=.*' /tmp/wd.out | cut -d= -f2)
          WINDOW=$(grep -oE '^window=.*' /tmp/wd.out | cut -d= -f2)
          {
            if [ "$ALERT" = "true" ]; then
              echo "⚠️ SILENT: the last ${WINDOW} daily email-ingest runs all fetched ZERO alert messages (counts:${counts:- none})."
              echo "   The pipe into the Procurement/Alerts Gmail label is broken, not quiet: check the Outlook rule / Power Automate flow (issue #154 has the fix list)."
            elif [ -z "$counts" ]; then
              echo "unknown: no fetched-count lines found in the last ${THRESHOLD} successful daily runs (see the Actions tab)."
            else
              echo "healthy: fetched counts over the last ${WINDOW} successful daily runs:${counts}."
            fi
          } > /tmp/pipe_health.md
          cat /tmp/pipe_health.md

      - name: Build digest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TODAY=$(date -u +%F)
          SINCE=$(date -u -d "${DIGEST_WINDOW_DAYS} days ago" +%FT%TZ)

          # Failed automation runs since the last digest slot - the ONLY place
          # failures are reported now (no per-run alert emails).
          gh run list --limit 100 --json workflowName,conclusion,createdAt,url,event \
            --jq ".[] | select(.conclusion == \"failure\") | select(.createdAt >= \"${SINCE}\") | \"- \(.workflowName) (\(.event)) failed on \(.createdAt) ([run](\(.url)))\"" \
            > /tmp/failed_runs.md 2>/dev/null || true

          {
            echo "# Procurement ingest digest - ${TODAY}"
            echo
            echo "Triggered by: \`${EVENT_NAME}\` ([run #${RUN_NUMBER}](${RUN_URL})). One email per Mon/Thu slot; covers the last ${DIGEST_WINDOW_DAYS} days."
            echo
            if [ -s /tmp/failed_runs.md ]; then
              echo "## ⚠️ Failed automation runs since the last digest"
              echo
              cat /tmp/failed_runs.md
              echo
              echo "Open the run, read the first red step, fix, then \"Re-run all jobs\". Failures are reported here only."
              echo
            fi
            echo "## Email-alert pipe health"
            echo
            cat /tmp/pipe_health.md
            echo
            echo "## New since last digest (rows created in the last ${DIGEST_WINDOW_DAYS} days)"
            echo
            echo '```text'
            python tools/notify_push.py --created-date "${TODAY}" --since-days "${DIGEST_WINDOW_DAYS}" --print
            echo '```'
            echo
            echo "## Current active pipeline"
            echo
            echo '```text'
            python tools/pipeline.py summary
            echo '```'
            echo
            echo "## Top opportunities by win_score (composite rank)"
            echo
            echo '```text'
            python tools/win_score.py rank --source pipeline --top 10
            echo '```'
            echo
            echo "## Fix this to unlock the most win-weighted pipeline (readiness backlog)"
            echo
            echo '```text'
            python tools/readiness.py backlog
            echo '```'
            echo
            echo "## ⏰ Response deadlines — act or close"
            echo
            echo '```text'
            python tools/pipeline.py deadlines
            echo '```'
            echo
            echo '```text'
            python tools/lead_radar.py deadlines
            echo '```'
            echo
            echo "## ✉️ Send-by reminders (bid_ready / drafting rows, due - 2d)"
            echo
            echo '```text'
            python tools/pipeline.py calendar --emit --stdout
            echo '```'
            echo
            echo "## Current Lead Radar"
            echo
            echo '```text'
            python tools/lead_radar.py summary
            echo '```'
            echo
            echo "## Upcoming re-bid prep windows"
            echo
            echo '```text'
            python tools/lead_radar.py calendar --emit --stdout
            echo '```'
            echo
            echo "## Demand Radar — upcoming buy-windows (pre-RFP construction signals; sales outreach, not bids)"
            echo
            echo '```text'
            python tools/demand_radar.py summary
            echo '```'
            echo
            echo "## Open automation PRs"
            echo
          } > /tmp/digest.md

          gh pr list --state open --json number,title,url,headRefName,updatedAt \
            --jq '.[] | select(.headRefName | startswith("auto/")) | "- #\(.number) [\(.title)](\(.url)) (`\(.headRefName)`, updated \(.updatedAt))"' \
            > /tmp/open_auto_prs.md

          if [ -s /tmp/open_auto_prs.md ]; then
            cat /tmp/open_auto_prs.md >> /tmp/digest.md
          else
            echo "No open automation PRs." >> /tmp/digest.md
          fi

          {
            echo
            echo "## Recent ingest runs"
            echo
          } >> /tmp/digest.md

          gh run list --limit 30 \
            --json workflowName,conclusion,status,createdAt,url,event \
            --jq '.[] | select(.workflowName == "Twice-weekly SAM.gov mattress ingest" or .workflowName == "Daily email-alert ingest (IMAP)" or .workflowName == "Twice-weekly RSS/feed ingest") | "- \(.workflowName): \(.conclusion // .status) on \(.createdAt) ([run](\(.url)))"' \
            > /tmp/recent_runs.md

          if [ -s /tmp/recent_runs.md ]; then
            cat /tmp/recent_runs.md >> /tmp/digest.md
          else
            echo "No recent ingest runs found." >> /tmp/digest.md
          fi

          {
            echo
            echo "## What to do"
            echo
            echo "- **Response deadlines first — active pipeline, then Lead Radar.** Anything under \`DUE WITHIN\` needs a send/no-bid call now; anything under \`MISSED\`/\`OVERDUE\` is a window that closed on our watch — log the send if it went out, otherwise close the row to a terminal status (\`no-bid\`/\`lost\`/\`no-fit\`/\`stale\`) so the list stays honest. \`SUBMITTED - awaiting award\` rows need a POC follow-up at due + 14d."
            echo "- Send-by reminders are the alarm for bid_ready/drafting rows (due - 2d). Operator/assistant: create each \`already_scheduled: false\` event via the Google Calendar MCP tool and record its id in \`bids/active/_calendar_state.json\`. A \`WARN ... gate is blocked\` line is a row due soon that is not ready — clear the blockers or no-bid it today."
            echo "- If there are open automation PRs, review those next — merge them the day they land, since two open ingest runs will collide on overlapping windows."
            echo "- Active pipeline rows are confirmed bid candidates; Lead Radar rows are watch/research signals."
            echo "- Demand Radar rows are pre-RFP private-sector construction signals for human outreach (sales), NOT biddable solicitations."
            echo "- Re-bid prep windows are dated prep-start reminders for expiring awarded contracts. Pushing them to Google Calendar is an operator/assistant step: read \`leads/review/_calendar_events.json\` and create each \`already_scheduled: false\` event via the Google Calendar MCP tool, then record its id in \`leads/review/_calendar_state.json\`."
            echo "- If both counts look unchanged and there are no automation PRs, no action is needed."
            echo
            echo "_This is the only scheduled email from the procurement system. Nothing is posted to a GitHub issue; failures and pipe health are reported above._"
          } >> /tmp/digest.md

          cat /tmp/digest.md >> "$GITHUB_STEP_SUMMARY"

      # The step name is load-bearing: the guard job keys off "Send digest
      # email" succeeding to decide that today's digest is done. --strict makes
      # a failed delivery fail the run (delivery IS the job here).
      - name: Send digest email
        shell: bash
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_EMAIL_TO: ${{ secrets.DIGEST_EMAIL_TO }}
        run: |
          python tools/notify_push.py \
            --subject "[Silverline] Procurement digest $(date -u +%F)" \
            --body-file /tmp/digest.md \
            --to "$DIGEST_EMAIL_TO" \
            --strict

      # Dead-man's-switch: ping healthchecks.io ONLY on success, so a missed
      # or failed Mon/Thu digest raises an alert that does not depend on
      # GitHub's scheduler or notification email. No-op until the operator
      # creates the check (Mon/Thu schedule, ~2 h grace) and sets the
      # HEALTHCHECK_URL repo secret.
      - name: Healthcheck ping (success only)
        if: success()
        shell: bash
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -n "$HEALTHCHECK_URL" ]; then
            curl -fsS -m 10 --retry 3 "$HEALTHCHECK_URL" >/dev/null || true
            echo "Pinged healthcheck."
          else
            echo "HEALTHCHECK_URL not set - skipping ping."
          fi

      # If the digest itself fails there is no digest to report it in, so send
      # a short note to the SAME mailbox. No GitHub issue (that was the
      # second-mailbox notification path).
      - name: Email a short failure note (same mailbox)
        if: failure()
        shell: bash
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_EMAIL_TO: ${{ secrets.DIGEST_EMAIL_TO }}
        run: |
          python tools/notify_push.py --failure --workflow "$WORKFLOW" --run-url "$RUN_URL" \
            --to "$DIGEST_EMAIL_TO" || true
